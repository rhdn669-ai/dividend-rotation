name: Snapshot Dividend Predictions

on:
  schedule:
    # 매시간 실행 (UTC). ET 9~16시 캡처 윈도우와 cron 지연에 대비
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run snapshot script
        run: node scripts/snapshot.js
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/predictions.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-update prediction snapshots [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi
